name: timecue_desktop
description: TimeCue Windows 房间与日程本视觉骨架
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  file_selector: ^1.1.0
  window_manager: 0.5.2
  tray_manager: 0.5.2
  path: ^1.9.1
  yaml_edit: ^2.2.4
dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/room/
    - assets/tray/
