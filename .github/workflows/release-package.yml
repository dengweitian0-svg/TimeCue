name: Windows Release Package

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows Release Verify
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 设置 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: 检查并构建完整发行包
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: 验证原生生命周期
        shell: pwsh
        run: |
          cmake -S desktop/test/native -B desktop/build/release-native -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build desktop/build/release-native --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          ctest --test-dir desktop/build/release-native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 保存正式发行包及校验值
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: timecue-windows-x64
          path: build/releases/*.zip*
