name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify PR Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.classify.outputs.go }}
      flutter: ${{ steps.classify.outputs.flutter }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - name: 按变更路径分类
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const selected = { go: false, flutter: false, python: false };
            const selectAll = () => {
              selected.go = true;
              selected.flutter = true;
              selected.python = true;
            };
            const isDocumentation = (path) => {
              const normalized = path.replaceAll('\\', '/');
              const lower = normalized.toLowerCase();
              return normalized.startsWith('docs/') ||
                normalized.startsWith('.codex/') ||
                /\.(md|mdx|rst)$/.test(lower);
            };
            const classify = (path) => {
              const normalized = path.replaceAll('\\', '/');
              if (isDocumentation(normalized)) return;
              if (/\.(go)$/.test(normalized) ||
                  /^(go\.mod|go\.sum|go\.work|go\.work\.sum)$/.test(normalized) ||
                  /^(cmd|internal|migrations)\//.test(normalized)) {
                selected.go = true;
                return;
              }
              if (normalized.startsWith('desktop/')) {
                selected.flutter = true;
                return;
              }
              if (/^scripts\/[^/]+\.py$/.test(normalized)) {
                selected.python = true;
                return;
              }
              selectAll();
            };

            if (files.length >= 3000) {
              selectAll();
              core.warning('PR 文件数达到 GitHub REST API 的 3000 文件上限，保守运行全部检查。');
            } else {
              for (const file of files) {
                classify(file.filename);
                if (file.previous_filename) classify(file.previous_filename);
              }
            }

            for (const [name, enabled] of Object.entries(selected)) {
              core.setOutput(name, String(enabled));
            }

  go-checks:
    name: Go Windows Checks
    runs-on: windows-latest
    timeout-minutes: 20
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true')
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检测变更分类失败
        if: needs.changes.result != 'success'
        run: exit 1

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测 Go 模块
        id: go-module
        run: |
          if (Test-Path -LiteralPath go.mod) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'exists=true'
          } else {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'exists=false'
            Write-Output '当前仓库尚未包含 go.mod，暂时跳过 Go 检查。'
          }

      - name: 设置 Go 环境
        if: steps.go-module.outputs.exists == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查代码格式
        if: steps.go-module.outputs.exists == 'true'
        run: |
          $unformatted = @()
          $taskUtf8 = [System.Text.UTF8Encoding]::new($false)
          $goFiles = @(git ls-files -- '*.go')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($goFile in $goFiles) {
            $source = [System.IO.File]::ReadAllText($goFile).Replace("`r`n", "`n")
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = (Get-Command gofmt).Source
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardInput = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.StandardInputEncoding = $taskUtf8
            $startInfo.StandardOutputEncoding = $taskUtf8
            $formatter = [System.Diagnostics.Process]::Start($startInfo)
            $formatter.StandardInput.Write($source)
            $formatter.StandardInput.Close()
            $formatted = $formatter.StandardOutput.ReadToEnd()
            $formatter.WaitForExit()
            if ($formatter.ExitCode -ne 0) { throw "gofmt 检查失败：$goFile" }
            if ($formatted -cne $source) { $unformatted += $goFile }
            $formatter.Dispose()
          }
          if ($unformatted.Count -gt 0) {
            Write-Output '以下文件未通过 gofmt 检查：'
            $unformatted
            exit 1
          }
          Write-Output ("Go 格式通过：{0} 个受版本控制文件，按 LF 比较 gofmt 输出。" -f $goFiles.Count)

      - name: 静态检查
        if: steps.go-module.outputs.exists == 'true'
        run: go vet ./...

      - name: 运行测试
        if: steps.go-module.outputs.exists == 'true'
        run: go test -p 1 ./...

  flutter-checks:
    name: Flutter Windows Checks
    runs-on: windows-latest
    timeout-minutes: 20
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.flutter == 'true' || needs.changes.outputs.python == 'true')
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: 检测变更分类失败
        if: needs.changes.result != 'success'
        run: exit 1

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行发行更新脚本测试
        if: needs.changes.outputs.python == 'true'
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts -p test_update.py -v

      - name: 设置 Flutter stable
        if: needs.changes.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: 安装 Flutter 依赖
        if: needs.changes.outputs.flutter == 'true'
        run: flutter pub get

      - name: 检查 Dart 格式
        if: needs.changes.outputs.flutter == 'true'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态检查
        if: needs.changes.outputs.flutter == 'true'
        run: flutter analyze

      - name: 运行 Flutter 测试
        if: needs.changes.outputs.flutter == 'true'
        run: flutter test
