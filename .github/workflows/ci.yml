name: CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测 Go 模块
        id: go-module
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "当前仓库尚未包含 go.mod，暂时跳过 Go 检查。"
          fi

      - name: 设置 Go 环境
        if: steps.go-module.outputs.exists == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查代码格式
        if: steps.go-module.outputs.exists == 'true'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        if: steps.go-module.outputs.exists == 'true'
        run: go vet ./...

      - name: 运行测试
        if: steps.go-module.outputs.exists == 'true'
        run: go test ./...
