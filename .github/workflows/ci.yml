name: CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Windows Checks
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测 Go 模块
        id: go-module
        run: |
          if (Test-Path -LiteralPath go.mod) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'exists=true'
          } else {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'exists=false'
            Write-Output '当前仓库尚未包含 go.mod，暂时跳过 Go 检查。'
          }

      - name: 设置 Go 环境
        if: steps.go-module.outputs.exists == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查代码格式
        if: steps.go-module.outputs.exists == 'true'
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) {
            Write-Output '以下文件未通过 gofmt 检查：'
            $unformatted
            exit 1
          }

      - name: 静态检查
        if: steps.go-module.outputs.exists == 'true'
        run: go vet ./...

      - name: 运行测试
        if: steps.go-module.outputs.exists == 'true'
        run: go test -p 1 ./...

  flutter-checks:
    name: Flutter Windows Checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: 安装 Flutter 依赖
        run: flutter pub get
      - name: 检查 Dart 格式
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 静态检查
        run: flutter analyze
      - name: 运行 Flutter 测试
        run: flutter test
      - name: 构建 Windows 桌面端
        run: flutter build windows --release
      - name: 构建 Windows 单实例原生测试
        run: cmake -S test/native -B build/d7-native -A x64
      - name: 编译 Windows 单实例原生测试
        run: cmake --build build/d7-native --config Release
      - name: 验证 Windows 单实例与参数转交
        run: ctest --test-dir build/d7-native -C Release --output-on-failure
